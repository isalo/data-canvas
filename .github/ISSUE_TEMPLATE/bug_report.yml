name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what is wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps or a repository link that reproduces the issue.
      placeholder: |
        1. Define an entity with ...
        2. Render <EntityScreen ... />
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: packages
    attributes:
      label: Affected package(s) and version(s)
      placeholder: "@data-canvas/react 0.1.0"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS, Node.js version, framework (Next.js 15, ...), database
