name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@data-canvas"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publish access
        run: |
          set -euo pipefail
          echo "npm user: $(npm whoami)"
          echo "Checking @data-canvas org access..."
          if ! npm org ls data-canvas >/dev/null 2>&1; then
            echo "::error::npm user cannot manage the @data-canvas org. Confirm you created org 'data-canvas' on npmjs.com and your npm user is an Owner. Then regenerate an Automation token and update the NPM_TOKEN secret."
            exit 1
          fi
          echo "Org members:"
          npm org ls data-canvas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --filter "./packages/*" --filter "./packages/adapters/*"

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
